#
# SRAMLink Protocol Configuration Overlay
#
# Use this with: west build -b <board> -- -DOVERLAY_CONFIG=prj_sramlink.conf
#

# nRF 802.15.4 Radio Driver (standalone, no networking stack)
CONFIG_NRF_802154_RADIO_DRIVER=y
CONFIG_NRF_802154_SL_OPENSOURCE=y
CONFIG_MPSL=n

# SRAMLink Protocol
CONFIG_SRAMLINK=y
CONFIG_SRAMLINK_LOG_LEVEL=3
CONFIG_SRAMLINK_RADIO_CHANNEL=15
CONFIG_SRAMLINK_TX_POWER=4

# Crypto support (for message encryption) - using Nordic Security
CONFIG_ENTROPY_GENERATOR=y
CONFIG_NRF_SECURITY=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192
CONFIG_PSA_WANT_ALG_CBC_NO_PADDING=y
CONFIG_PSA_WANT_ALG_ECB_NO_PADDING=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y

# Enable legacy mbedTLS AES API
CONFIG_MBEDTLS_AES_C=y
CONFIG_MBEDTLS_CIPHER_AES_ENABLED=y
CONFIG_MBEDTLS_LEGACY_CRYPTO_C=y

# NVS for pairing persistence
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Increase stack size for crypto operations
CONFIG_MAIN_STACK_SIZE=8192
