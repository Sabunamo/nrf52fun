#
# SRAMLink Configuration for nRF5340-DK (App Core)
#
# Uses serialized 802.15.4 driver - network core runs ipc_radio
#

# Enable UART console (override RTT from main prj.conf)
CONFIG_UART_CONSOLE=y
CONFIG_RTT_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_LOG_BACKEND_UART=y

# SRAMLink Protocol
CONFIG_SRAMLINK=y
CONFIG_SRAMLINK_LOG_LEVEL=3
CONFIG_SRAMLINK_RADIO_CHANNEL=15
CONFIG_SRAMLINK_TX_POWER=4

# Serialized 802.15.4 driver (communicates with network core)
CONFIG_NRF_802154_SER_HOST=y

# Crypto support
CONFIG_ENTROPY_GENERATOR=y
CONFIG_NRF_SECURITY=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192
CONFIG_PSA_WANT_ALG_CBC_NO_PADDING=y
CONFIG_PSA_WANT_ALG_ECB_NO_PADDING=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_MBEDTLS_AES_C=y
CONFIG_MBEDTLS_CIPHER_AES_ENABLED=y
CONFIG_MBEDTLS_LEGACY_CRYPTO_C=y

# NVS for pairing persistence
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Increase stack size
CONFIG_MAIN_STACK_SIZE=8192
